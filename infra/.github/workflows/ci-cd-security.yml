name: CI/CD Security Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

env:
  RESOURCE_GROUP: demo-rg
  LOCATION: eastus

jobs:
  security-and-deploy:
    name: Scan and deploy Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Microsoft Security DevOps
        id: msdo
        uses: microsoft/security-devops-action@latest
        with:
          categories: IaC

      - name: Upload MSDO SARIF to code scanning
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}

      - name: Upload MSDO SARIF artifact
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: actions/upload-artifact@v4
        with:
          name: msdo-sarif-results
          path: ${{ steps.msdo.outputs.sarifFile }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters location="$LOCATION"
